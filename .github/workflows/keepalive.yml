# Pings the Supabase database twice a week so the free project is not
# paused after 7 days without activity.
# Needs two repository secrets: SUPABASE_URL and SUPABASE_ANON_KEY.

name: Supabase keep-alive

on:
  schedule:
    # 03:00 UTC (09:00 Dhaka) every Monday and Thursday
    - cron: '0 3 * * 1,4'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call keepalive() in the database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Missing SUPABASE_URL or SUPABASE_ANON_KEY secret" >&2
            exit 1
          fi
          response=$(curl --silent --show-error --fail-with-body \
            --retry 3 --retry-delay 10 \
            -X POST "$SUPABASE_URL/rest/v1/rpc/keepalive" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "Response: $response"
          [ "$response" = '"ok"' ]
